# Deploy static Next.js export to GitHub Pages (gh-pages branch).
#
# ONE-TIME SETUP (required or deploy will not show a site):
#   Repo → Settings → Pages → Build and deployment
#   Source: "Deploy from a branch"
#   Branch: gh-pages   Folder: / (root)
#
# Live URL: https://petal-gang.github.io/operation-taku/

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.repository }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Ensure .nojekyll
        run: touch out/.nojekyll

      - name: Verify build output
        run: npm run verify:pages

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: "deploy: ${{ github.sha }}"
